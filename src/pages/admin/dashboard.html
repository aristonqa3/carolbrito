<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Ana Karoline Arquitetura</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../../styles/tokens.css">
    <link rel="stylesheet" href="../../styles/base.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="../../styles/layouts.css">
    
    <style>
        /* ============================================
           HEADER ADMINISTRATIVO
           ============================================ */
        .admin-header {
            background: linear-gradient(135deg, var(--color-stone-800) 0%, var(--color-stone-900) 100%);
            color: var(--color-text-inverse);
            padding: var(--spacing-md) var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
            backdrop-filter: blur(10px);
        }
        
        .admin-header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .admin-header h1 {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: #ffffff;
        }
        
        .admin-header h1::before {
            content: "📊";
            font-size: var(--font-size-lg);
        }
        
        .admin-actions {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }
        
        .admin-actions a {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            color: var(--color-stone-300);
            text-decoration: none;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            font-weight: var(--font-weight-medium);
        }
        
        .admin-actions a:hover {
            color: var(--color-text-inverse);
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .admin-actions a::before {
            content: "👁️";
            font-size: var(--font-size-base);
        }
        
        .admin-header .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .admin-header .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        /* ============================================
           CONTAINER PRINCIPAL
           ============================================ */
        .admin-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: var(--spacing-lg);
            padding-bottom: var(--spacing-3xl);
        }
        
        @media (min-width: 768px) {
            .admin-content {
                padding: var(--spacing-xl) var(--spacing-2xl);
            }
        }
        
        /* ============================================
           CARD DE FORMULÁRIO
           ============================================ */
        .form-card {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
            margin-bottom: var(--spacing-2xl);
            border: 1px solid var(--color-border-light);
            transition: box-shadow var(--transition-base);
        }
        
        .form-card:hover {
            box-shadow: var(--shadow-xl);
        }
        
        .form-card h2 {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--color-border-light);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .form-card h2::before {
            content: "➕";
            font-size: var(--font-size-xl);
        }
        
        /* ============================================
           CARDS DE PROJETOS
           ============================================ */
        .projects-card {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-border-light);
        }
        
        .projects-card h2 {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--color-border-light);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .projects-card h2::before {
            content: "📁";
            font-size: var(--font-size-xl);
        }
        
        .project-item {
            background: var(--color-stone-50);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }
        
        .project-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--color-primary);
            transform: scaleY(0);
            transition: transform var(--transition-base);
        }
        
        .project-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--color-border);
        }
        
        .project-item:hover::before {
            transform: scaleY(1);
        }
        
        .project-item:last-child {
            margin-bottom: 0;
        }
        
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }
        
        .project-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        
        .project-title {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-sm);
            line-height: var(--line-height-tight);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-sm);
        }
        
        .project-description {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            line-height: var(--line-height-relaxed);
            margin-bottom: var(--spacing-md);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .project-actions {
            display: flex;
            gap: var(--spacing-sm);
            flex-shrink: 0;
        }
        
        .btn-delete {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: var(--color-text-inverse);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            border: none;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            box-shadow: var(--shadow-sm);
        }
        
        .btn-delete:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
        }
        
        .btn-delete:active {
            transform: translateY(0);
        }
        
        .btn-delete::before {
            content: "🗑️";
            font-size: var(--font-size-base);
        }
        
        .project-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) 0;
            max-width: 100%;
        }
        
        .image-preview {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: var(--radius-md);
            border: 2px solid var(--color-border-light);
            transition: all var(--transition-fast);
            cursor: pointer;
        }
        
        .image-preview:hover {
            transform: scale(1.03);
            border-color: var(--color-primary);
            box-shadow: var(--shadow-md);
        }
        
        /* ============================================
           SELETOR DE IMAGEM DE CAPA
           ============================================ */
        .cover-hint {
            font-size: var(--font-size-xs);
            color: var(--color-stone-500);
            margin-bottom: var(--spacing-sm);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        
        .cover-hint::before {
            content: "💡";
        }
        
        .image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            cursor: pointer;
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: all var(--transition-fast);
        }
        
        .image-wrapper .image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-md);
        }
        
        .image-wrapper:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow-md);
        }
        
        .image-wrapper.is-cover {
            border: 3px solid var(--color-primary);
            box-shadow: 0 0 0 2px rgba(41, 37, 36, 0.2);
        }
        
        .image-wrapper.is-cover .image-preview {
            border: none;
        }
        
        .cover-badge {
            position: absolute;
            top: var(--spacing-xs);
            left: var(--spacing-xs);
            background: var(--color-primary);
            color: white;
            font-size: 10px;
            font-weight: var(--font-weight-bold);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .cover-badge-hover {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;
            font-size: 10px;
            font-weight: var(--font-weight-medium);
            padding: var(--spacing-md) var(--spacing-xs) var(--spacing-xs);
            text-align: center;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        
        .image-wrapper:not(.is-cover):hover .cover-badge-hover {
            opacity: 1;
        }
        
        /* ============================================
           SEÇÃO DE IMAGENS DO PROJETO
           ============================================ */
        .images-section {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--color-border-light);
        }
        
        .images-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }
        
        .btn-add-images {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-sm) var(--spacing-md);
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-stone-700) 100%);
            color: white;
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }
        
        .btn-add-images:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .image-actions {
            position: absolute;
            top: var(--spacing-xs);
            right: var(--spacing-xs);
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        
        .image-wrapper:hover .image-actions {
            opacity: 1;
        }
        
        .btn-set-cover,
        .btn-remove-image {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }
        
        .btn-set-cover {
            background: rgba(255, 255, 255, 0.95);
            color: #f59e0b;
        }
        
        .btn-set-cover:hover {
            background: #fef3c7;
            transform: scale(1.1);
        }
        
        .btn-remove-image {
            background: rgba(220, 38, 38, 0.9);
            color: white;
        }
        
        .btn-remove-image:hover {
            background: #dc2626;
            transform: scale(1.1);
        }
        
        .image-wrapper.is-cover .btn-remove-image {
            top: auto;
            bottom: var(--spacing-xs);
        }
        
        /* ============================================
           BOTÃO DE EDITAR
           ============================================ */
        .btn-edit {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: var(--color-text-inverse);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            border: none;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            box-shadow: var(--shadow-sm);
        }
        
        .btn-edit:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }
        
        /* ============================================
           MODAL DE EDIÇÃO
           ============================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: var(--spacing-md);
        }
        
        .modal-content {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border-light);
        }
        
        .modal-header h3 {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin: 0;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--color-text-secondary);
            cursor: pointer;
            padding: var(--spacing-xs);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }
        
        .modal-close:hover {
            background: var(--color-stone-100);
            color: var(--color-text-primary);
        }
        
        .modal-body {
            padding: var(--spacing-lg);
        }
        
        .modal-body .form-group {
            margin-bottom: var(--spacing-md);
        }
        
        .modal-body label {
            display: block;
            font-weight: var(--font-weight-medium);
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
        }
        
        .modal-body input,
        .modal-body select,
        .modal-body textarea {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            transition: border-color var(--transition-fast);
        }
        
        .modal-body input:focus,
        .modal-body select:focus,
        .modal-body textarea:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: var(--spacing-md);
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border-light);
            margin-top: var(--spacing-md);
        }
        
        .modal-footer .btn {
            padding: var(--spacing-sm) var(--spacing-xl);
        }
        
        .images-count {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--color-stone-200) 0%, var(--color-stone-300) 100%);
            border-radius: var(--radius-md);
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            border: 2px dashed var(--color-border);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .images-count:hover {
            background: linear-gradient(135deg, var(--color-stone-300) 0%, var(--color-stone-400) 100%);
            color: var(--color-text-primary);
        }
        
        .no-images-text {
            font-size: var(--font-size-sm);
            color: var(--color-stone-400);
            font-style: italic;
            padding: var(--spacing-md) 0;
        }
        
        /* ============================================
           ESTADO VAZIO
           ============================================ */
        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl) var(--spacing-lg);
            color: var(--color-text-secondary);
        }
        
        .empty-state::before {
            content: "📭";
            font-size: 4rem;
            display: block;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }
        
        .empty-state p {
            font-size: var(--font-size-lg);
            margin-bottom: var(--spacing-sm);
        }
        
        /* ============================================
           RESPONSIVIDADE
           ============================================ */
        @media (max-width: 768px) {
            .admin-header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--spacing-sm);
            }
            
            .admin-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .project-header {
                flex-direction: column;
            }
            
            .project-actions {
                width: 100%;
                justify-content: flex-end;
            }
            
            .form-card,
            .projects-card {
                padding: var(--spacing-lg);
            }
        }
        
        /* ============================================
           ANIMAÇÕES
           ============================================ */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .project-item {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* ============================================
           MELHORIAS DE ACESSIBILIDADE
           ============================================ */
        .admin-header h1:focus,
        .admin-actions a:focus,
        .btn-delete:focus {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }
        
        /* ============================================
           MELHORIAS DE FORMULÁRIO
           ============================================ */
        .project-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }
        
        .form-row {
            display: flex;
            gap: var(--spacing-lg);
        }
        
        .form-row-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }
        
        .form-group {
            margin-bottom: 0;
        }
        
        .form-group-full {
            width: 100%;
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--color-border-light);
            margin-top: var(--spacing-md);
        }
        
        .btn-lg {
            padding: var(--spacing-md) var(--spacing-xl);
            font-size: var(--font-size-base);
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .form-success {
            background: #dcfce7;
            color: #166534;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border: 1px solid #86efac;
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-weight: var(--font-weight-medium);
            animation: slideDown 0.3s ease-out;
        }
        
        .form-success::before {
            content: "✅";
            font-size: var(--font-size-lg);
        }
        
        .form-error {
            background: #fef2f2;
            color: #991b1b;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border: 1px solid #fca5a5;
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-weight: var(--font-weight-medium);
            animation: slideDown 0.3s ease-out;
        }
        
        .form-error::before {
            content: "⚠️";
            font-size: var(--font-size-lg);
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* ============================================
           UPLOAD DE IMAGENS
           ============================================ */
        .image-upload-area {
            position: relative;
            border: 2px dashed var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            text-align: center;
            background: var(--color-stone-50);
            transition: all var(--transition-base);
            cursor: pointer;
        }
        
        .image-upload-area:hover,
        .image-upload-area.drag-over {
            border-color: var(--color-primary);
            background: rgba(41, 37, 36, 0.05);
        }
        
        .image-upload-area.drag-over {
            transform: scale(1.01);
        }
        
        .image-upload-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .image-upload-content {
            pointer-events: none;
        }
        
        .image-upload-icon {
            color: var(--color-stone-400);
            margin-bottom: var(--spacing-md);
        }
        
        .image-upload-text {
            font-size: var(--font-size-base);
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-xs);
        }
        
        .image-upload-text span {
            color: var(--color-primary);
            font-weight: var(--font-weight-medium);
            text-decoration: underline;
        }
        
        .image-upload-hint {
            font-size: var(--font-size-xs);
            color: var(--color-stone-400);
        }
        
        /* Grid de Preview de Imagens */
        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
            max-height: 320px;
            overflow-y: auto;
            padding: var(--spacing-xs);
        }
        
        .image-preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            background: var(--color-stone-100);
            animation: fadeIn 0.3s ease-out;
        }
        
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-base);
        }
        
        .image-preview-item:hover img {
            transform: scale(1.05);
        }
        
        .image-remove-btn {
            position: absolute;
            top: var(--spacing-xs);
            right: var(--spacing-xs);
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all var(--transition-fast);
        }
        
        .image-preview-item:hover .image-remove-btn {
            opacity: 1;
            transform: scale(1);
        }
        
        .image-remove-btn:hover {
            background: #dc2626;
        }
        
        .image-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: var(--spacing-xs);
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            color: white;
            font-size: var(--font-size-xs);
            text-align: center;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        
        .image-preview-item:hover .image-name {
            opacity: 1;
        }
        
        .image-counter {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-top: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-stone-100);
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        
        .image-counter #image-count {
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
        }
        
        /* ============================================
           RESPONSIVIDADE
           ============================================ */
        @media (max-width: 768px) {
            .form-row-2col {
                grid-template-columns: 1fr;
            }
            
            .image-preview-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>

    <header class="admin-header">
        <div class="admin-header-content">
            <h1 class="font-lora">Painel Administrativo</h1>
            <div class="admin-actions">
                <a href="/">Ver Site</a>
                <button id="logout-btn" class="btn btn-secondary">
                    Sair
                </button>
            </div>
        </div>
    </header>

    <div class="admin-content">
        
        <!-- Formulário de Novo Projeto -->
        <div class="form-card">

        </div>

        <!-- Lista de Projetos -->
        <div class="projects-card">
            <h2 class="font-lora">Projetos Cadastrados</h2>
            <div id="projects-list">
                <!-- Projetos serão carregados aqui -->
            </div>
        </div>

    </div>

    <script type="module" src="./admin-dashboard.js"></script>
</body>
