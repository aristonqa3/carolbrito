<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Ana Karoline Arquitetura</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../../styles/tokens.css">
    <link rel="stylesheet" href="../../styles/base.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="../../styles/layouts.css">
    
    <style>
        .admin-header {
            background-color: var(--color-stone-800);
            color: var(--color-text-inverse);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }
        
        .admin-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--container-padding);
        }
        
        .project-item {
            background: var(--color-surface);
            border: var(--border-width) solid var(--color-border-light);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            transition: all var(--transition-base);
        }
        
        .project-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .image-preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: var(--radius-md);
            margin: 5px;
        }
    </style>
</head>
<body class="bg-stone-100 min-h-screen">
    
    <!-- Header -->
    <header class="admin-header">
        <div class="admin-content flex justify-between items-center">
            <h1 class="text-2xl font-bold font-lora">Painel Administrativo</h1>
            <div class="flex gap-4 items-center">
                <a href="../index.html" class="text-stone-300 hover:text-white">Ver Site</a>
                <button id="logout-btn" class="btn btn-secondary text-sm">
                    Sair
                </button>
            </div>
        </div>
    </header>

    <div class="admin-content">
        
        <!-- Formulário de Novo Projeto -->
        <div class="card mb-8">
            <h2 class="text-2xl font-bold font-lora mb-6 text-stone-800">Adicionar Novo Projeto</h2>
            <div id="project-form-container"></div>
        </div>

        <!-- Lista de Projetos -->
        <div class="card">
            <h2 class="text-2xl font-bold font-lora mb-6 text-stone-800">Projetos Cadastrados</h2>
            <div id="projects-list" class="space-y-4">
                <!-- Projetos serão carregados aqui -->
            </div>
        </div>

    </div>

    <script type="module" src="./admin-dashboard.js"></script>
</body>
</html>
