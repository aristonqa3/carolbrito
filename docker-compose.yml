services:
  # ============================================
  # Supabase Local Database
  # Banco PostgreSQL local para desenvolvimento
  # Storage e Auth estão no Supabase Cloud
  # ============================================
  supabase-db:
    image: supabase/postgres:15.1.0.147
    container_name: carolbrito-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.carolbrito.service=database"
      - "com.carolbrito.environment=development"

  # ============================================
  # Supabase Studio
  # Interface web para visualizar e gerenciar o banco local
  # Acesse em: http://localhost:54323
  # ============================================
  supabase-studio:
    image: supabase/studio:latest
    container_name: carolbrito-studio
    restart: unless-stopped
    ports:
      - "54323:3000"
    environment:
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_URL: postgres://postgres:postgres@supabase-db:5432/postgres
    depends_on:
      supabase-db:
        condition: service_healthy
    labels:
      - "com.carolbrito.service=studio"
      - "com.carolbrito.environment=development"

volumes:
  supabase-db-data:
    name: carolbrito-db-data
